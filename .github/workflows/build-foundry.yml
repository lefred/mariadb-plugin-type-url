name: Build and package TYPE_URL plugin

on:
  push:
    branches:
      - main
    tags:
      - "v*"

  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    uses: lefred/mariadb-plugin-ci/.github/workflows/build-plugin-new.yml@v1
    with:
       mariadb_versions: |
          77519
          77521
          77522
          77100
          77144
       # test_suites: type_url
       almalinux_version: "10"
       allow_partial_release: true
       package_formats: tgz
