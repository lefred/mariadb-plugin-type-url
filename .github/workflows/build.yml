name: Build and package TYPE_URL plugin

on:
  push:
    branches:
      - mtr
    tags:
      - "v*"

  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    uses: lefred/mariadb-plugin-ci/.github/workflows/build-plugin.yml@v1
    with:
      plugin_name: type-url
      plugin_directory: type_url
      build_target: type_url
      plugin_library: type_url.so      

      mariadb_versions: |
          13.0.2
          13.1.1
          
      cmake_options: -DPLUGIN_TYPE_URL=DYNAMIC
      test_suite: type_url
      run_tests: false
      allow_partial_release: true
